# REINVENT 4 Staged Learning Configuration for NK1R (Neurokinin 1 Receptor)
# Target: Generate molecules with high predicted pIC50 against NK1R
#
# NK1R is a GPCR target for pain, emesis, and neuropsychiatric disorders.
# Known actives include aprepitant-like compounds with CF3-substituted aromatics.
#
# Prior model and paths will be set programmatically by reinvent4_baseline.py

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "tb_nk1r"
json_out_config = "_nk1r_config.json"

[parameters]

prior_file = "__PRIOR_FILE__"
agent_file = "__AGENT_FILE__"
summary_csv_prefix = "nk1r_rl"

batch_size = 128
use_checkpoint = false
purge_memories = false
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

# Stage 1: Drug-likeness optimization
[[stage]]
max_score = 0.6
min_steps = 50
max_steps = 200
chkpt_file = "nk1r_stage1.chkpt"
termination = "simple"

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name = "Structural Alerts"
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]",
    "[*;r13]", "[*;r14]", "[*;r15]", "[*;r16]", "[*;r17]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]", "[#7;!n][#7;!n]",
    "C#C", "C(=[O,S])[O,S]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]"
]

[[stage.scoring.component]]
[stage.scoring.component.QED]

[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.5

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]

[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular Weight"
weight = 0.3
transform.type = "double_sigmoid"
transform.high = 600.0
transform.low = 250.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.SlogP]

[[stage.scoring.component.SlogP.endpoint]]
name = "SLogP"
weight = 0.2
transform.type = "double_sigmoid"
transform.high = 5.5
transform.low = 1.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

# Stage 2: Similarity to known NK1R actives + drug-likeness
[[stage]]
max_score = 0.8
min_steps = 50
max_steps = 300
chkpt_file = "nk1r_stage2.chkpt"
termination = "simple"

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name = "Structural Alerts"
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]",
    "[*;r13]", "[*;r14]", "[*;r15]", "[*;r16]", "[*;r17]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]", "[#7;!n][#7;!n]",
    "C#C", "C(=[O,S])[O,S]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]"
]

[[stage.scoring.component]]
[stage.scoring.component.QED]

[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.3

[[stage.scoring.component]]
[stage.scoring.component.TanimotoSimilarity]

[[stage.scoring.component.TanimotoSimilarity.endpoint]]
name = "NK1R Active Similarity"
weight = 0.5
# Representative NK1R actives (high pIC50 compounds from dataset)
params.smiles = [
    "O=C(NCc1cc(C(F)(F)F)cc(C(F)(F)F)c1)c1c(CO)nc2ccccc2c1-c1ccccc1"
]
params.radius = 3
params.use_counts = true
params.use_features = true

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]

[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular Weight"
weight = 0.2
transform.type = "double_sigmoid"
transform.high = 600.0
transform.low = 250.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0
