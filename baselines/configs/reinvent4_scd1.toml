# REINVENT 4 Staged Learning Configuration for SCD-1 (Stearoyl-CoA Desaturase 1)
# Target: Generate molecules with high predicted pIC50 against SCD-1
#
# This config uses a two-stage curriculum learning approach:
#   Stage 1: Drug-likeness + structural alerts filter
#   Stage 2: Drug-likeness + similarity to known SCD-1 actives
#
# Prior model and paths will be set programmatically by reinvent4_baseline.py

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "tb_scd1"
json_out_config = "_scd1_config.json"

[parameters]

prior_file = "__PRIOR_FILE__"
agent_file = "__AGENT_FILE__"
summary_csv_prefix = "scd1_rl"

batch_size = 128
use_checkpoint = false
purge_memories = false
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

# Stage 1: Drug-likeness optimization
[[stage]]
max_score = 0.6
min_steps = 50
max_steps = 200
chkpt_file = "scd1_stage1.chkpt"
termination = "simple"

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name = "Structural Alerts"
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]",
    "[*;r13]", "[*;r14]", "[*;r15]", "[*;r16]", "[*;r17]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]", "[#7;!n][#7;!n]",
    "C#C", "C(=[O,S])[O,S]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]"
]

[[stage.scoring.component]]
[stage.scoring.component.QED]

[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.5

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]

[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular Weight"
weight = 0.3
transform.type = "double_sigmoid"
transform.high = 550.0
transform.low = 250.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.SlogP]

[[stage.scoring.component.SlogP.endpoint]]
name = "SLogP"
weight = 0.2
transform.type = "double_sigmoid"
transform.high = 5.0
transform.low = 1.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

# Stage 2: Similarity to known SCD-1 actives + drug-likeness
[[stage]]
max_score = 0.8
min_steps = 50
max_steps = 300
chkpt_file = "scd1_stage2.chkpt"
termination = "simple"

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name = "Structural Alerts"
params.smarts = [
    "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]",
    "[*;r13]", "[*;r14]", "[*;r15]", "[*;r16]", "[*;r17]",
    "[#8][#8]", "[#6;+]", "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]", "[#7;!n][#7;!n]",
    "C#C", "C(=[O,S])[O,S]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]"
]

[[stage.scoring.component]]
[stage.scoring.component.QED]

[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.3

[[stage.scoring.component]]
[stage.scoring.component.TanimotoSimilarity]

[[stage.scoring.component.TanimotoSimilarity.endpoint]]
name = "SCD1 Active Similarity"
weight = 0.5
# Representative SCD-1 actives (high pIC50 compounds from dataset)
params.smiles = [
    "FC(F)(F)c1cccc2c1CCC1(CCN(c3ccc(-c4nnc(Cc5cccnc5)o4)nn3)CC1)O2",
    "CCNc1ccc(C(=O)Nc2ncc(Cc3cccc(C(F)(F)F)c3)s2)cc1OCCO"
]
params.radius = 3
params.use_counts = true
params.use_features = true

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]

[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular Weight"
weight = 0.2
transform.type = "double_sigmoid"
transform.high = 550.0
transform.low = 250.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0
